<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-labelledby="scheme-title scheme-desc">
<title id="scheme-title">Государственная поверочная схема</title>
<desc id="scheme-desc">Центральная цепь: государственный первичный эталон, эталоны-копии, эталоны первого, второго, третьего и четвёртого разрядов. От эталонов-копий единицу передают рабочим средствам измерений наивысшей точности, от первого разряда — высшей, от второго — высокой, от третьего — средней, от четвёртого — низкой точности. Стрелки показывают передачу размера единицы.</desc>
<defs><marker id="scheme-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#244b3e"/></marker></defs>
<rect width="1000" height="900" fill="#fff"/>
<g fill="none" stroke="#244b3e" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#scheme-arrow)">
<path data-edge-from="primary" data-edge-to="copies" d="M530 80V130"/>
<path data-edge-from="copies" data-edge-to="rank1" d="M530 184V240"/>
<path data-edge-from="rank1" data-edge-to="rank2" d="M530 294V350"/>
<path data-edge-from="rank2" data-edge-to="rank3" d="M530 404V460"/>
<path data-edge-from="rank3" data-edge-to="rank4" d="M530 514V570"/>
<path data-edge-from="copies" data-edge-to="work1" d="M530 184V210H180V660"/>
<path data-edge-from="rank1" data-edge-to="work2" d="M530 294V320H880V660"/>
<path data-edge-from="rank2" data-edge-to="work3" d="M530 404V430H310V825H290"/>
<path data-edge-from="rank3" data-edge-to="work4" d="M530 514V540H750V825H770"/>
<path data-edge-from="rank4" data-edge-to="work5" d="M530 624V795"/>
</g>
