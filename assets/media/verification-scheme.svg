<g data-rd-node="copies"><rect x="320" y="130" width="420" height="54" fill="#e3eee8" stroke="#244b3e" stroke-width="2.5"/><text x="530" y="165">Эталоны-копии</text></g>
<g data-rd-node="rank1"><rect x="320" y="240" width="420" height="54" fill="#e3eee8" stroke="#244b3e" stroke-width="2.5"/><text x="530" y="275">Эталоны 1-го разряда</text></g>
<g data-rd-node="rank2"><rect x="320" y="350" width="420" height="54" fill="#e3eee8" stroke="#244b3e" stroke-width="2.5"/><text x="530" y="385">Эталоны 2-го разряда</text></g>
<g data-rd-node="rank3"><rect x="320" y="460" width="420" height="54" fill="#e3eee8" stroke="#244b3e" stroke-width="2.5"/><text x="530" y="495">Эталоны 3-го разряда</text></g>
<g data-rd-node="rank4"><rect x="320" y="570" width="420" height="54" fill="#e3eee8" stroke="#244b3e" stroke-width="2.5"/><text x="530" y="605">Эталоны 4-го разряда</text></g>
<g data-rd-node="work1"><rect x="70" y="660" width="220" height="80" fill="#fff1dc" stroke="#244b3e" stroke-width="2.5"/><text x="180" y="692">Наивысшей</text><text x="180" y="724">точности</text></g>
