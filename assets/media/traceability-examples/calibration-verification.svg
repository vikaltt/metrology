<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="t"><title id="t">Калибровка устанавливает соотношение, поверка подтверждает соответствие требованиям</title><rect width="360" height="300" fill="#fff"/><g fill="#e3eee8" stroke="#244b3e" stroke-width="2"><rect x="15" y="12" width="330" height="128" rx="5"/><rect x="15" y="160" width="330" height="128" rx="5"/></g><g font-family="system-ui,sans-serif" font-size="22" fill="#203a32" text-anchor="middle"><text x="180" y="43" font-size="24">Калибровка</text><text x="180" y="75">Показания ↔ значения</text><text x="180" y="105">с неопределённостями</text><text x="180" y="191" font-size="24">Поверка</text><text x="180" y="223">Подтверждение</text><text x="180" y="253">соответствия требованиям</text></g></svg>
